name: broadcast
# Отключено: рассылка теперь работает на Cloudflare (вебхук), этот запуск только вручную.
on:
  workflow_dispatch:
concurrency:
  group: broadcast
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Посты из лички бота
        env:
          QUIZ_BOT_TOKEN: ${{ secrets.QUIZ_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QUIZ_DB: /tmp/broadcast.sqlite3
        run: python broadcast.py
      - name: Сохранить
        run: |
          git config user.name "quizbot"
          git config user.email "quizbot@users.noreply.github.com"
          git add broadcasts.json 2>/dev/null || exit 0
          git commit -m "broadcasts" || exit 0
          git pull --rebase -X theirs || true
          git push
