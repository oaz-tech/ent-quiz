name: fill-questions
on:
  schedule:
    - cron: "10 17 * * *"      # 22:10 по Казахстану — пополнение запаса вопросов
  workflow_dispatch:
concurrency:
  group: quizbot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Генерация вопросов
        env:
          QUIZ_BOT_TOKEN: ${{ secrets.QUIZ_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FILL_MINUTES: "55"
        run: python quizbot.py fill
      - name: Сохранить состояние
        run: |
          git config user.name "quizbot"
          git config user.email "quizbot@users.noreply.github.com"
          git add -A
          git commit -m "fill $(date -u +%FT%H%M)" || exit 0
          git pull --rebase -X ours || true
          git push
